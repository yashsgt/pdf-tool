<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeFlow — PDF Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

:root{
--primary:#111827;
--secondary:#6b7280;
--border:#e5e7eb;
--danger:#ef4444;
--danger-bg:#fee2e2;
}

body{
margin:0;
font-family:system-ui;
background:linear-gradient(to bottom,#f8fafc,#eef2ff);
}

.navbar{
height:64px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
}

.logo{
font-weight:700;
font-size:18px;
}

.nav-links{
display:flex;
gap:28px;
}

.nav-links button{
border:none;
background:none;
cursor:pointer;
color:var(--secondary);
font-weight:500;
}

.nav-links button.active{
color:var(--primary);
}

.hero{
text-align:center;
margin-top:40px;
}

.hero h1{
font-size:36px;
}

.container{
display:flex;
justify-content:center;
margin-top:30px;
}

.card{
background:white;
padding:40px;
border-radius:18px;
width:1000px;
box-shadow:0 20px 60px rgba(0,0,0,.06);
}

.title{
font-size:24px;
font-weight:600;
}

.back-btn{
border:none;
background:#f3f4f6;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.upload-area{
margin-top:20px;
padding:26px;
border:2px dashed var(--border);
border-radius:14px;
text-align:center;
cursor:pointer;
background:#fafafa;
}

.merge-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-top:20px;
max-height:420px;
overflow-y:auto;
}

.merge-card{
position:relative;
background:#f9fafb;
border-radius:12px;
padding:10px;
text-align:center;
transition:.2s ease;
cursor:pointer;
}

.merge-card canvas{
width:100%;
border-radius:6px;
margin-bottom:6px;
}

.merge-card.selected{
background:var(--danger-bg);
border:2px solid var(--danger);
transform:scale(1.05);
box-shadow:0 4px 12px rgba(239,68,68,.3);
}

.merge-remove{
background:var(--danger);
border:none;
color:white;
font-size:11px;
padding:3px 8px;
border-radius:6px;
cursor:pointer;
}

.merge-badge{
position:absolute;
top:6px;
left:6px;
background:#111827;
color:white;
font-size:11px;
padding:2px 6px;
border-radius:20px;
}

.preview-box{
margin-top:20px;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
display:flex;
align-items:center;
gap:16px;
background:#fafafa;
}

.preview-box canvas{
width:70px;
}

.action-btn{
margin-top:25px;
padding:14px 38px;
border:none;
border-radius:10px;
background:var(--primary);
color:white;
cursor:pointer;
}

.hidden{
display:none;
}

input[type=file]{
display:none;
}

.footer{
margin-top:35px;
text-align:center;
font-size:12px;
color:#9ca3af;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MergeFlow</div>
<div class="nav-links">
<button id="mergeTab" class="active" onclick="showTool('merge')">Merge</button>
<button id="splitTab" onclick="showTool('split')">Split</button>
<button id="compressTab" onclick="showTool('compress')">Compress</button>
<button id="deleteTab" onclick="showTool('delete')">Delete Pages</button>
</div>
</div>

<div class="hero">
<h1>All-in-one PDF toolkit</h1>
</div>

<div class="container">
<div class="card">

<!-- MERGE TOOL -->

<div id="mergeTool">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearMergeFiles()">Reset</button>
<div class="title">Merge PDFs</div>
</div>

<div class="upload-area" onclick="mergeInput.click()">
Drop PDFs or click to browse
</div>

<input id="mergeInput" type="file" multiple accept="application/pdf">

<div id="mergeGrid" class="merge-grid"></div>

<button class="action-btn" onclick="mergePDFs()">Merge and download</button>

</div>


<!-- SPLIT TOOL -->

<div id="splitTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearSplitFile()">Reset</button>
<div class="title">Split PDF</div>
</div>

<div class="upload-area" onclick="splitInput.click()">Upload PDF</div>

<input id="splitInput" type="file">

<div id="splitPreview" class="preview-box hidden">
<canvas id="splitCanvas"></canvas>
<div id="splitMeta"></div>
</div>

<button class="action-btn" onclick="splitPDF()">Split and download ZIP</button>

</div>


<!-- COMPRESS TOOL -->

<div id="compressTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearCompressFile()">Reset</button>
<div class="title">Compress PDF</div>
</div>

<div class="upload-area" onclick="compressInput.click()">Upload PDF</div>

<input id="compressInput" type="file">

<div id="compressPreview" class="preview-box hidden">
<canvas id="compressCanvas"></canvas>
<div id="compressMeta"></div>
</div>

<button class="action-btn" onclick="compressPDF()">Compress and download</button>

</div>


<!-- DELETE TOOL -->

<div id="deleteTool" class="hidden">

<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
<button class="back-btn" onclick="clearDeleteFile()">Reset</button>
<div class="title">Delete Pages</div>

<input id="deletePagesInput"
placeholder="Example: 2,5,7-12"
style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;width:240px;">
</div>

<div class="upload-area" onclick="deleteInput.click()">Upload PDF</div>

<input id="deleteInput" type="file">

<div id="deletePreviewGrid" class="merge-grid"></div>

<button class="action-btn" onclick="deletePages()">Delete selected pages and download</button>

</div>


<div class="footer">
Files never leave your device
</div>

</div>
</div>

<script>

function showTool(tool){

mergeTool.classList.toggle("hidden",tool!=="merge")
splitTool.classList.toggle("hidden",tool!=="split")
compressTool.classList.toggle("hidden",tool!=="compress")
deleteTool.classList.toggle("hidden",tool!=="delete")

mergeTab.classList.toggle("active",tool==="merge")
splitTab.classList.toggle("active",tool==="split")
compressTab.classList.toggle("active",tool==="compress")
deleteTab.classList.toggle("active",tool==="delete")

}

/* PREVIEW */

async function renderPreview(file,canvas){

const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise
const page=await pdf.getPage(1)
const viewport=page.getViewport({scale:.6})

canvas.width=viewport.width
canvas.height=viewport.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport
}).promise

return pdf.numPages

}


/* DELETE TOOL */

let deleteFile=null
let selectedPages=new Set()

deleteInput.onchange=async()=>{

deleteFile=deleteInput.files[0]

selectedPages.clear()
deletePreviewGrid.innerHTML=""

const pdf=await pdfjsLib.getDocument(await deleteFile.arrayBuffer()).promise

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i)
const viewport=page.getViewport({scale:.4})

const canvas=document.createElement("canvas")
canvas.width=viewport.width
canvas.height=viewport.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport
}).promise

const wrapper=document.createElement("div")
wrapper.className="merge-card"

const badge=document.createElement("div")
badge.className="merge-badge"
badge.innerText=i

wrapper.appendChild(badge)
wrapper.appendChild(canvas)

wrapper.onclick=()=>{

if(selectedPages.has(i)){
selectedPages.delete(i)
wrapper.classList.remove("selected")
}else{
selectedPages.add(i)
wrapper.classList.add("selected")
}

deletePagesInput.value=[...selectedPages].sort((a,b)=>a-b).join(",")

}

deletePreviewGrid.appendChild(wrapper)

}

}


/* INPUT SYNC */

deletePagesInput.addEventListener("input",()=>{

const typed=parsePages(deletePagesInput.value)

selectedPages.clear()

document.querySelectorAll("#deletePreviewGrid .merge-card")
.forEach((card,index)=>{

let page=index+1

if(typed.has(page)){
selectedPages.add(page)
card.classList.add("selected")
}else{
card.classList.remove("selected")
}

})

})


function parsePages(text){

const pages=new Set()

text.split(",").forEach(part=>{

part=part.trim()

if(part.includes("-")){

let[start,end]=part.split("-").map(Number)

if(!isNaN(start)&&!isNaN(end)){
for(let i=start;i<=end;i++) pages.add(i)
}

}else{

let p=Number(part)

if(!isNaN(p)) pages.add(p)

}

})

return pages

}


async function deletePages(){

if(!deleteFile){
alert("Upload a PDF first")
return
}

if(selectedPages.size===0){
alert("Select pages first")
return
}

const pdf=await PDFLib.PDFDocument.load(await deleteFile.arrayBuffer())

const newPdf=await PDFLib.PDFDocument.create()

for(let i=0;i<pdf.getPageCount();i++){

if(!selectedPages.has(i+1)){

const[page]=await newPdf.copyPages(pdf,[i])
newPdf.addPage(page)

}

}

download(await newPdf.save(),"pages-removed.pdf")

}


function clearDeleteFile(){

deleteFile=null
selectedPages.clear()
deletePreviewGrid.innerHTML=""
deletePagesInput.value=""
deleteInput.value=""

}


function download(data,name){

const blob=new Blob([data])
const link=document.createElement("a")
link.href=URL.createObjectURL(blob)
link.download=name
link.click()

}

</script>

</body>
</html>
