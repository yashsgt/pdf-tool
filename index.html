<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MergeFlow | Free PDF Merge, Split & Compress Tool</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#111827">

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

:root{
--primary:#111827;
--secondary:#6b7280;
--border:#e5e7eb;
}

body{
margin:0;
font-family:Inter,system-ui,sans-serif;
background:linear-gradient(to bottom,#f8fafc,#eef2ff);
}

/* NAVBAR */

.navbar{
height:64px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
}

.logo{
font-weight:700;
font-size:18px;
}

.nav-links{
display:flex;
gap:28px;
}

.nav-links button{
border:none;
background:none;
cursor:pointer;
color:var(--secondary);
font-weight:500;
}

.nav-links button.active{
color:var(--primary);
}

/* HERO */

.hero{
text-align:center;
margin-top:40px;
}

.hero h1{
font-size:38px;
margin-bottom:10px;
}

/* CARD */

.container{
display:flex;
justify-content:center;
margin-top:30px;
}

.card{
background:white;
padding:40px;
border-radius:18px;
width:1000px;
box-shadow:0 20px 60px rgba(0,0,0,.06);
}

/* TITLE */

.title{
font-size:24px;
font-weight:600;
}

.subtitle{
color:var(--secondary);
margin-top:5px;
}

/* BACK BUTTON */

.back-btn{
border:none;
background:#f3f4f6;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

/* UPLOAD */

.upload-area{
margin-top:20px;
padding:26px;
border:2px dashed var(--border);
border-radius:14px;
text-align:center;
cursor:pointer;
background:#fafafa;
}

/* MERGE GRID */

.merge-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-top:20px;
max-height:420px;
overflow-y:auto;
}

.merge-card{
position:relative;
background:#f9fafb;
border-radius:12px;
padding:10px;
text-align:center;
cursor:grab;
}

.merge-card canvas{
width:100%;
border-radius:6px;
margin-bottom:6px;
}

.merge-remove{
background:#ef4444;
border:none;
color:white;
font-size:11px;
padding:3px 8px;
border-radius:6px;
cursor:pointer;
}

.merge-badge{
position:absolute;
top:6px;
left:6px;
background:#111827;
color:white;
font-size:11px;
padding:2px 6px;
border-radius:20px;
}

/* PREVIEW BOX */

.preview-box{
margin-top:20px;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
display:flex;
align-items:center;
gap:16px;
background:#fafafa;
}

.preview-box canvas{
width:70px;
}

/* BUTTON */

.action-btn{
margin-top:25px;
padding:14px 38px;
border:none;
border-radius:10px;
background:var(--primary);
color:white;
cursor:pointer;
}

/* STATUS */

.progress{
margin-top:12px;
font-size:13px;
color:var(--secondary);
}

.hidden{
display:none;
}

input{
display:none;
}

.footer{
margin-top:35px;
text-align:center;
font-size:12px;
color:#9ca3af;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MergeFlow</div>

<div class="nav-links">
<button id="mergeTab" class="active" onclick="showTool('merge')">Merge</button>
<button id="splitTab" onclick="showTool('split')">Split</button>
<button id="compressTab" onclick="showTool('compress')">Compress</button>
</div>
</div>

<div class="hero">
<h1>All-in-one PDF toolkit</h1>
</div>

<div class="container">
<div class="card">

<!-- MERGE -->

<div id="mergeTool">

<div style="display:flex;align-items:center;gap:12px;">
<button class="back-btn" onclick="clearMergeFiles()">←</button>
<div class="title">Merge PDFs</div>
</div>

<div class="subtitle">Arrange files visually before downloading</div>

<div class="upload-area" onclick="mergeInput.click()">
Drop PDFs here or click to browse
</div>

<input id="mergeInput" type="file" multiple accept="application/pdf">

<div id="mergeGrid" class="merge-grid"></div>

<button class="action-btn" onclick="mergePDFs()">Merge and download</button>

<div id="mergeStatus" class="progress"></div>

</div>

<!-- SPLIT -->

<div id="splitTool" class="hidden">

<div style="display:flex;align-items:center;gap:12px;">
<button class="back-btn" onclick="clearSplitFile()">←</button>
<div class="title">Split PDF</div>
</div>

<div class="upload-area" onclick="splitInput.click()">Upload PDF</div>

<input id="splitInput" type="file">

<div id="splitPreview" class="preview-box hidden">
<canvas id="splitCanvas"></canvas>
<div id="splitMeta"></div>
</div>

<button class="action-btn" onclick="splitPDF()">Split and download ZIP</button>

<div id="splitStatus" class="progress"></div>

</div>

<!-- COMPRESS -->

<div id="compressTool" class="hidden">

<div style="display:flex;align-items:center;gap:12px;">
<button class="back-btn" onclick="clearCompressFile()">←</button>
<div class="title">Compress PDF</div>
</div>

<div class="upload-area" onclick="compressInput.click()">Upload PDF</div>

<input id="compressInput" type="file">

<div id="compressPreview" class="preview-box hidden">
<canvas id="compressCanvas"></canvas>
<div id="compressMeta"></div>
</div>

<button class="action-btn" onclick="compressPDF()">Compress and download</button>

<div id="compressStatus" class="progress"></div>

</div>

<div class="footer">
Files never leave your device
</div>

</div>
</div>

<script>

/* TOOL SWITCH */

function showTool(tool){

mergeTool.classList.toggle("hidden",tool!=="merge")
splitTool.classList.toggle("hidden",tool!=="split")
compressTool.classList.toggle("hidden",tool!=="compress")

mergeTab.classList.toggle("active",tool==="merge")
splitTab.classList.toggle("active",tool==="split")
compressTab.classList.toggle("active",tool==="compress")

}

/* PREVIEW RENDERER */

async function renderPreview(file,canvas){

const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise
const page=await pdf.getPage(1)

const viewport=page.getViewport({scale:.6})

canvas.width=viewport.width
canvas.height=viewport.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport
}).promise

return pdf.numPages

}

/* MERGE GRID */

const mergeGrid=document.getElementById("mergeGrid")
let mergeFiles=[]
let draggedCard=null

mergeInput.onchange=()=>{

for(const file of mergeInput.files){

mergeFiles.push(file)
createMergeCard(file)

}

updateMergeBadges()

}

function createMergeCard(file){

const card=document.createElement("div")
card.className="merge-card"
card.draggable=true

const badge=document.createElement("div")
badge.className="merge-badge"
card.appendChild(badge)

const canvas=document.createElement("canvas")
renderPreview(file,canvas)

const name=document.createElement("div")
name.innerText=file.name
name.style.fontSize="11px"

const remove=document.createElement("button")
remove.className="merge-remove"
remove.innerText="Remove"

remove.onclick=()=>{
mergeGrid.removeChild(card)
mergeFiles.splice([...mergeGrid.children].indexOf(card),1)
updateMergeBadges()
}

card.appendChild(canvas)
card.appendChild(name)
card.appendChild(remove)

card.addEventListener("dragstart",()=>draggedCard=card)

card.addEventListener("dragover",e=>e.preventDefault())

card.addEventListener("drop",()=>{

if(draggedCard===card)return

const cards=[...mergeGrid.children]

const draggedIndex=cards.indexOf(draggedCard)
const targetIndex=cards.indexOf(card)

if(draggedIndex<targetIndex)
mergeGrid.insertBefore(draggedCard,card.nextSibling)
else
mergeGrid.insertBefore(draggedCard,card)

updateMergeBadges()

})

mergeGrid.appendChild(card)

}

function updateMergeBadges(){

[...mergeGrid.children].forEach((card,i)=>{
card.querySelector(".merge-badge").innerText=i+1
})

}

function clearMergeFiles(){

mergeFiles=[]
mergeGrid.innerHTML=""
mergeInput.value=""
mergeStatus.innerText=""

}

/* SPLIT */

let splitFile=null

splitInput.onchange=async()=>{

splitFile=splitInput.files[0]

const canvas=document.getElementById("splitCanvas")

const pages=await renderPreview(splitFile,canvas)

splitMeta.innerHTML=`<b>${splitFile.name}</b><br>${pages} pages`

splitPreview.classList.remove("hidden")

}

function clearSplitFile(){

splitFile=null
splitPreview.classList.add("hidden")
splitMeta.innerHTML=""
splitCanvas.getContext("2d").clearRect(0,0,splitCanvas.width,splitCanvas.height)
splitInput.value=""
splitStatus.innerText=""

}

async function splitPDF(){

const pdf=await PDFLib.PDFDocument.load(await splitFile.arrayBuffer())

const zip=new JSZip()

for(let i=0;i<pdf.getPageCount();i++){

const doc=await PDFLib.PDFDocument.create()

const [page]=await doc.copyPages(pdf,[i])

doc.addPage(page)

zip.file(`page-${i+1}.pdf`,await doc.save())

}

download(await zip.generateAsync({type:"blob"}),"split-pages.zip")

}

/* COMPRESS */

let compressFile=null

compressInput.onchange=async()=>{

compressFile=compressInput.files[0]

const canvas=document.getElementById("compressCanvas")

const pages=await renderPreview(compressFile,canvas)

compressMeta.innerHTML=`<b>${compressFile.name}</b><br>${pages} pages`

compressPreview.classList.remove("hidden")

}

function clearCompressFile(){

compressFile=null
compressPreview.classList.add("hidden")
compressMeta.innerHTML=""
compressCanvas.getContext("2d").clearRect(0,0,compressCanvas.width,compressCanvas.height)
compressInput.value=""
compressStatus.innerText=""

}

async function compressPDF(){

const pdf=await PDFLib.PDFDocument.load(await compressFile.arrayBuffer())

download(await pdf.save({useObjectStreams:true}),"compressed.pdf")

}

/* DOWNLOAD */

function download(data,name){

const blob=new Blob([data])

const link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download=name
link.click()

}

</script>

</body>
</html>
