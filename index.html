<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeFlow — PDF Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

:root{
--primary:#111827;
--secondary:#6b7280;
--border:#e5e7eb;
}

body{
margin:0;
font-family:system-ui;
background:linear-gradient(to bottom,#f8fafc,#eef2ff);
}

.navbar{
height:64px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
}

.logo{
font-weight:700;
font-size:18px;
}

.nav-links{
display:flex;
gap:28px;
}

.nav-links button{
border:none;
background:none;
cursor:pointer;
color:var(--secondary);
font-weight:500;
}

.nav-links button.active{
color:var(--primary);
}

.hero{
text-align:center;
margin-top:40px;
}

.hero h1{
font-size:38px;
}

.container{
display:flex;
justify-content:center;
margin-top:30px;
}

.card{
background:white;
padding:40px;
border-radius:18px;
width:1000px;
box-shadow:0 20px 60px rgba(0,0,0,.06);
}

.title{
font-size:24px;
font-weight:600;
}

.subtitle{
color:var(--secondary);
margin-top:5px;
}

.back-btn{
border:none;
background:#f3f4f6;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.upload-area{
margin-top:20px;
padding:26px;
border:2px dashed var(--border);
border-radius:14px;
text-align:center;
cursor:pointer;
background:#fafafa;
}

.merge-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-top:20px;
max-height:420px;
overflow-y:auto;
}

.merge-card{
position:relative;
background:#f9fafb;
border-radius:12px;
padding:10px;
text-align:center;
}

.merge-card canvas{
width:100%;
border-radius:6px;
margin-bottom:6px;
}

.merge-remove{
background:#ef4444;
border:none;
color:white;
font-size:11px;
padding:3px 8px;
border-radius:6px;
cursor:pointer;
}

.merge-badge{
position:absolute;
top:6px;
left:6px;
background:#111827;
color:white;
font-size:11px;
padding:2px 6px;
border-radius:20px;
}

.preview-box{
margin-top:20px;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
display:flex;
align-items:center;
gap:16px;
background:#fafafa;
}

.preview-box canvas{
width:70px;
}

.action-btn{
margin-top:25px;
padding:14px 38px;
border:none;
border-radius:10px;
background:var(--primary);
color:white;
cursor:pointer;
}

.hidden{
display:none;
}

input{
display:none;
}

.footer{
margin-top:35px;
text-align:center;
font-size:12px;
color:#9ca3af;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MergeFlow</div>
<div class="nav-links">
<button id="mergeTab" class="active" onclick="showTool('merge')">Merge</button>
<button id="splitTab" onclick="showTool('split')">Split</button>
<button id="compressTab" onclick="showTool('compress')">Compress</button>
</div>
</div>

<div class="hero">
<h1>All-in-one PDF toolkit</h1>
</div>

<div class="container">
<div class="card">

<!-- MERGE -->

<div id="mergeTool">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearMergeFiles()">Reset</button>
<div class="title">Merge PDFs</div>
</div>

<div class="subtitle">Arrange files visually before downloading</div>

<div class="upload-area" onclick="mergeInput.click()">
Drop PDFs anywhere or click to browse
</div>

<input id="mergeInput" type="file" multiple accept="application/pdf">

<div id="mergeGrid" class="merge-grid"></div>

<button class="action-btn" onclick="mergePDFs()">Merge and download</button>

</div>


<!-- SPLIT -->

<div id="splitTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearSplitFile()">Reset</button>
<div class="title">Split PDF</div>
</div>

<div class="upload-area" onclick="splitInput.click()">Upload PDF</div>

<input id="splitInput" type="file">

<div id="splitPreview" class="preview-box hidden">
<canvas id="splitCanvas"></canvas>
<div id="splitMeta"></div>
</div>

<button class="action-btn" onclick="splitPDF()">Split and download ZIP</button>

</div>


<!-- COMPRESS -->

<div id="compressTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearCompressFile()">Reset</button>
<div class="title">Compress PDF</div>
</div>

<div class="upload-area" onclick="compressInput.click()">Upload PDF</div>

<input id="compressInput" type="file">

<div id="compressPreview" class="preview-box hidden">
<canvas id="compressCanvas"></canvas>
<div id="compressMeta"></div>
</div>

<button class="action-btn" onclick="compressPDF()">Compress and download</button>

</div>

<div class="footer">
Files never leave your device
</div>

</div>
</div>


<script>

/* TOOL SWITCH */

function showTool(tool){

mergeTool.classList.toggle("hidden",tool!=="merge")
splitTool.classList.toggle("hidden",tool!=="split")
compressTool.classList.toggle("hidden",tool!=="compress")

mergeTab.classList.toggle("active",tool==="merge")
splitTab.classList.toggle("active",tool==="split")
compressTab.classList.toggle("active",tool==="compress")

}


/* PREVIEW */

async function renderPreview(file,canvas){

const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise
const page=await pdf.getPage(1)

const viewport=page.getViewport({scale:.6})

canvas.width=viewport.width
canvas.height=viewport.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport
}).promise

return pdf.numPages

}


/* MERGE */

let mergeFiles=[]

mergeInput.onchange=e=>handleMergeFiles([...e.target.files])

function handleMergeFiles(files){

files.forEach(file=>{

if(file.type!=="application/pdf") return

mergeFiles.push(file)

createMergeCard(file)

})

updateBadges()

}

function createMergeCard(file){

const card=document.createElement("div")
card.className="merge-card"

const badge=document.createElement("div")
badge.className="merge-badge"
card.appendChild(badge)

const canvas=document.createElement("canvas")
renderPreview(file,canvas)

const label=document.createElement("div")
label.innerText=file.name
label.style.fontSize="11px"

const remove=document.createElement("button")
remove.className="merge-remove"
remove.innerText="Remove"

remove.onclick=()=>{

const index=[...mergeGrid.children].indexOf(card)

mergeFiles.splice(index,1)

card.remove()

updateBadges()

}

card.appendChild(canvas)
card.appendChild(label)
card.appendChild(remove)

mergeGrid.appendChild(card)

}

function updateBadges(){

[...mergeGrid.children].forEach((card,i)=>{

card.querySelector(".merge-badge").innerText=i+1

})

}

function clearMergeFiles(){

mergeFiles=[]
mergeGrid.innerHTML=""
mergeInput.value=""

}

async function mergePDFs(){

const merged=await PDFLib.PDFDocument.create()

for(const file of mergeFiles){

const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer())

const pages=await merged.copyPages(pdf,pdf.getPageIndices())

pages.forEach(p=>merged.addPage(p))

}

download(await merged.save(),"merged.pdf")

}


/* SPLIT */

let splitFile=null

splitInput.onchange=async()=>{

splitFile=splitInput.files[0]

const pages=await renderPreview(splitFile,splitCanvas)

splitMeta.innerHTML=`<b>${splitFile.name}</b><br>${pages} pages`

splitPreview.classList.remove("hidden")

}

async function splitPDF(){

if(!splitFile) return

const pdf=await PDFLib.PDFDocument.load(await splitFile.arrayBuffer())

const zip=new JSZip()

for(let i=0;i<pdf.getPageCount();i++){

const doc=await PDFLib.PDFDocument.create()

const [page]=await doc.copyPages(pdf,[i])

doc.addPage(page)

zip.file(`page-${i+1}.pdf`,await doc.save())

}

download(await zip.generateAsync({type:"blob"}),"split-pages.zip")

}

function clearSplitFile(){

splitPreview.classList.add("hidden")

splitInput.value=""

}


/* COMPRESS */

let compressFile=null

compressInput.onchange=async()=>{

compressFile=compressInput.files[0]

const pages=await renderPreview(compressFile,compressCanvas)

compressMeta.innerHTML=`<b>${compressFile.name}</b><br>${pages} pages`

compressPreview.classList.remove("hidden")

}

async function compressPDF(){

if(!compressFile) return

const pdf=await PDFLib.PDFDocument.load(await compressFile.arrayBuffer())

download(await pdf.save({useObjectStreams:true}),"compressed.pdf")

}

function clearCompressFile(){

compressPreview.classList.add("hidden")

compressInput.value=""

}


/* GLOBAL DRAG FROM FILE MANAGER */

document.addEventListener("dragover",e=>e.preventDefault())

document.addEventListener("drop",e=>{

e.preventDefault()

const files=[...e.dataTransfer.files]

if(!files.length) return

if(!mergeTool.classList.contains("hidden"))
handleMergeFiles(files)

if(!splitTool.classList.contains("hidden")){
splitFile=files[0]
splitInput.onchange({target:{files:[files[0]]}})
}

if(!compressTool.classList.contains("hidden")){
compressFile=files[0]
compressInput.onchange({target:{files:[files[0]]}})
}

})


/* DOWNLOAD */

function download(data,name){

const blob=new Blob([data])

const link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download=name

link.click()

}

</script>

</body>
</html>
