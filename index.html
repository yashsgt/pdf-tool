<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MergeFlow — PDF Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

:root{
--primary:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--danger:#ef4444;
--danger-bg:#fee2e2;
}

body{
margin:0;
font-family:system-ui, sans-serif;
background:#f8fafc;
color:#111827;
}

/* NAVBAR */

.navbar{
height:64px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
}

.logo{
font-weight:700;
font-size:18px;
}

.nav-links{
display:flex;
gap:26px;
}

.nav-links button{
border:none;
background:none;
cursor:pointer;
font-weight:500;
color:var(--muted);
}

.nav-links button.active{
color:var(--primary);
}

/* HERO */

.hero{
text-align:center;
margin-top:42px;
}

.hero h1{
font-size:38px;
margin-bottom:6px;
}

.hero p{
color:var(--muted);
}

/* MAIN CARD */

.container{
display:flex;
justify-content:center;
margin-top:28px;
}

.card{
background:white;
padding:40px;
border-radius:18px;
width:1000px;
box-shadow:0 20px 60px rgba(0,0,0,.06);
}

.title{
font-size:24px;
font-weight:600;
}

.back-btn{
border:none;
background:#f3f4f6;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
}

/* DROP ZONE */

.upload-area{
margin-top:20px;
padding:28px;
border:2px dashed var(--border);
border-radius:14px;
text-align:center;
cursor:pointer;
background:#fafafa;
}

/* GRID */

.merge-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-top:20px;
max-height:420px;
overflow-y:auto;
}

.merge-card{
position:relative;
background:#f9fafb;
border-radius:12px;
padding:10px;
cursor:pointer;
transition:.2s ease;
}

.merge-card canvas{
width:100%;
border-radius:6px;
}

.merge-card.selected{
background:var(--danger-bg);
border:2px solid var(--danger);
transform:scale(1.05);
}

.merge-remove{
background:var(--danger);
border:none;
color:white;
font-size:11px;
padding:3px 8px;
border-radius:6px;
margin-top:6px;
cursor:pointer;
}

.preview-box{
margin-top:20px;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
display:flex;
gap:14px;
background:#fafafa;
}

.preview-box canvas{
width:70px;
}

.action-btn{
margin-top:25px;
padding:14px 38px;
border:none;
border-radius:10px;
background:var(--primary);
color:white;
cursor:pointer;
}

.hidden{
display:none;
}

input[type=file]{
display:none;
}

/* FOOTER */

.footer{
margin-top:40px;
text-align:center;
font-size:13px;
color:#6b7280;
line-height:1.8;
}

.footer-credit{
margin-top:4px;
font-size:12px;
color:#9ca3af;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">MergeFlow</div>

<div class="nav-links">
<button id="mergeTab" class="active" onclick="showTool('merge')">Merge</button>
<button id="splitTab" onclick="showTool('split')">Split</button>
<button id="compressTab" onclick="showTool('compress')">Compress</button>
<button id="deleteTab" onclick="showTool('delete')">Delete Pages</button>
</div>
</div>

<div class="hero">
<h1>All-in-one PDF toolkit</h1>
<p>Fast, private and fully offline PDF processing in your browser</p>
</div>

<div class="container">
<div class="card">

<!-- MERGE -->

<div id="mergeTool">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearMerge()">Reset</button>
<div class="title">Merge PDFs</div>
</div>

<div class="upload-area" onclick="mergeInput.click()">
Drop PDFs here or click to browse
</div>

<input id="mergeInput" type="file" multiple accept="application/pdf">

<div id="mergeGrid" class="merge-grid"></div>

<button class="action-btn" onclick="mergePDF()">Merge and download</button>

</div>


<!-- SPLIT -->

<div id="splitTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearSplit()">Reset</button>
<div class="title">Split PDF</div>
</div>

<div class="upload-area" onclick="splitInput.click()">Upload PDF</div>

<input id="splitInput" type="file">

<div id="splitPreview" class="preview-box hidden">
<canvas id="splitCanvas"></canvas>
<div id="splitMeta"></div>
</div>

<button class="action-btn" onclick="splitPDF()">Split and download ZIP</button>

</div>


<!-- COMPRESS -->

<div id="compressTool" class="hidden">

<div style="display:flex;gap:12px;">
<button class="back-btn" onclick="clearCompress()">Reset</button>
<div class="title">Compress PDF</div>
</div>

<div class="upload-area" onclick="compressInput.click()">Upload PDF</div>

<input id="compressInput" type="file">

<div id="compressPreview" class="preview-box hidden">
<canvas id="compressCanvas"></canvas>
<div id="compressMeta"></div>
</div>

<button class="action-btn" onclick="compressPDF()">Compress and download</button>

</div>


<!-- DELETE PAGES -->

<div id="deleteTool" class="hidden">

<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
<button class="back-btn" onclick="clearDelete()">Reset</button>
<div class="title">Delete Pages</div>

<input id="deletePagesInput"
placeholder="Example: 2,5,7-12"
style="padding:8px;border:1px solid #e5e7eb;border-radius:8px;width:240px;">
</div>

<div class="upload-area" onclick="deleteInput.click()">Upload PDF</div>

<input id="deleteInput" type="file">

<div id="deletePreviewGrid" class="merge-grid"></div>

<button class="action-btn" onclick="deletePages()">Delete selected pages</button>

</div>


<div class="footer">
<div>Files never leave your device • Built with privacy-first design</div>
<div class="footer-credit">© Yash Singh</div>
</div>

</div>
</div>

<script>

/* TOOL SWITCH */

function showTool(tool){
mergeTool.classList.toggle("hidden",tool!=="merge")
splitTool.classList.toggle("hidden",tool!=="split")
compressTool.classList.toggle("hidden",tool!=="compress")
deleteTool.classList.toggle("hidden",tool!=="delete")

mergeTab.classList.toggle("active",tool==="merge")
splitTab.classList.toggle("active",tool==="split")
compressTab.classList.toggle("active",tool==="compress")
deleteTab.classList.toggle("active",tool==="delete")
}

/* PREVIEW */

async function preview(file,canvas){
const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise
const page=await pdf.getPage(1)
const vp=page.getViewport({scale:.6})
canvas.width=vp.width
canvas.height=vp.height
await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise
return pdf.numPages
}

/* MERGE */

let mergeFiles=[]

mergeInput.onchange=e=>{
[...e.target.files].forEach(file=>{
mergeFiles.push(file)
createMergeCard(file)
})
}

function createMergeCard(file){

const card=document.createElement("div")
card.className="merge-card"

const canvas=document.createElement("canvas")
preview(file,canvas)

const remove=document.createElement("button")
remove.className="merge-remove"
remove.innerText="Remove"

remove.onclick=()=>{
mergeFiles.splice([...mergeGrid.children].indexOf(card),1)
card.remove()
}

card.append(canvas,remove)
mergeGrid.append(card)
}

function clearMerge(){
mergeFiles=[]
mergeGrid.innerHTML=""
mergeInput.value=""
}

async function mergePDF(){
const out=await PDFLib.PDFDocument.create()
for(const f of mergeFiles){
const pdf=await PDFLib.PDFDocument.load(await f.arrayBuffer())
const pages=await out.copyPages(pdf,pdf.getPageIndices())
pages.forEach(p=>out.addPage(p))
}
download(await out.save(),"merged.pdf")
}

/* SPLIT */

let splitFile=null

splitInput.onchange=async()=>{
splitFile=splitInput.files[0]
const pages=await preview(splitFile,splitCanvas)
splitMeta.innerHTML="<b>"+splitFile.name+"</b><br>"+pages+" pages"
splitPreview.classList.remove("hidden")
}

async function splitPDF(){
const pdf=await PDFLib.PDFDocument.load(await splitFile.arrayBuffer())
const zip=new JSZip()
for(let i=0;i<pdf.getPageCount();i++){
const d=await PDFLib.PDFDocument.create()
const[p]=await d.copyPages(pdf,[i])
d.addPage(p)
zip.file(`page-${i+1}.pdf`,await d.save())
}
download(await zip.generateAsync({type:"blob"}),"split.zip")
}

function clearSplit(){
splitPreview.classList.add("hidden")
splitInput.value=""
}

/* COMPRESS */

let compressFile=null

compressInput.onchange=async()=>{
compressFile=compressInput.files[0]
const pages=await preview(compressFile,compressCanvas)
compressMeta.innerHTML="<b>"+compressFile.name+"</b><br>"+pages+" pages"
compressPreview.classList.remove("hidden")
}

async function compressPDF(){
const pdf=await PDFLib.PDFDocument.load(await compressFile.arrayBuffer())
download(await pdf.save({useObjectStreams:true}),"compressed.pdf")
}

function clearCompress(){
compressPreview.classList.add("hidden")
compressInput.value=""
}

/* DELETE */

let deleteFile=null
let selectedPages=new Set()

deleteInput.onchange=async()=>{
deleteFile=deleteInput.files[0]
selectedPages.clear()
deletePreviewGrid.innerHTML=""

const pdf=await pdfjsLib.getDocument(await deleteFile.arrayBuffer()).promise

for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i)
const vp=page.getViewport({scale:.4})

const canvas=document.createElement("canvas")
canvas.width=vp.width
canvas.height=vp.height

await page.render({
canvasContext:canvas.getContext("2d"),
viewport:vp
}).promise

const card=document.createElement("div")
card.className="merge-card"
card.append(canvas)

card.onclick=()=>{
if(selectedPages.has(i)){
selectedPages.delete(i)
card.classList.remove("selected")
}else{
selectedPages.add(i)
card.classList.add("selected")
}
deletePagesInput.value=[...selectedPages].join(",")
}

deletePreviewGrid.append(card)
}
}

/* INPUT RANGE SUPPORT */

deletePagesInput.addEventListener("input",()=>{

selectedPages.clear()

const parts=deletePagesInput.value.split(",")

parts.forEach(p=>{

if(p.includes("-")){
let[a,b]=p.split("-").map(Number)
for(let i=a;i<=b;i++) selectedPages.add(i)
}else{
selectedPages.add(Number(p))
}

})

document.querySelectorAll("#deletePreviewGrid .merge-card")
.forEach((card,index)=>{
card.classList.toggle("selected",selectedPages.has(index+1))
})

})

async function deletePages(){

const pdf=await PDFLib.PDFDocument.load(await deleteFile.arrayBuffer())
const out=await PDFLib.PDFDocument.create()

for(let i=0;i<pdf.getPageCount();i++){
if(!selectedPages.has(i+1)){
const[p]=await out.copyPages(pdf,[i])
out.addPage(p)
}
}

download(await out.save(),"pages-removed.pdf")
}

function clearDelete(){
deletePreviewGrid.innerHTML=""
deletePagesInput.value=""
deleteInput.value=""
selectedPages.clear()
}

/* DOWNLOAD */

function download(data,name){
const blob=new Blob([data])
const link=document.createElement("a")
link.href=URL.createObjectURL(blob)
link.download=name
link.click()
}

</script>

</body>
</html>
